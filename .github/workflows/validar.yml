name: validar
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Un solo comando, el mismo que corre Vercel (`buildCommand` en vercel.json) y el que se
      # teclea antes de empujar: validar.mjs + comprobar-libres.mjs + vite build. `vite build` NO
      # detecta un identificador global roto (Rollup no resuelve globales); comprobar-libres sí, y
      # desde el 20 sep 2026 es Vercel quien lo corre antes de publicar: el CI aquí es el espejo.
      - run: npm run validar
