name: validar
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/validar.mjs index.html
      # `vite build` NO detecta un identificador global roto: Rollup no resuelve globales.
      # Esta es la única red contra una referencia que quedó colgando al partir el monolito.
      - run: node tools/partir/comprobar-libres.mjs
      - run: npm run build
